name: Build Thorn Corps 0.11 (field test) for RimWorld 1.7
on:
  workflow_dispatch:
  push:
    paths:
      - 'ThornWhip/**'
      - 'tests_*.py'
      - '.github/workflows/build.yml'
      - 'AUDIT_REPORT_RU.md'
jobs:
  compile-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install 'Pillow>=10.0,<13'
      - name: Check all internal source and Def references
        id: audit
        continue-on-error: true
        run: python tests_project_integrity.py
      - name: Validate 0.10 definitions and research data
        id: static
        continue-on-error: true
        run: python tests_static_09.py
      - name: Validate actual in-game textures and Ideology styles
        id: graphics
        continue-on-error: true
        run: python tests_visuals_10.py
      - name: Validate 0.11 runtime contracts and authored graphic layers
        id: test011
        continue-on-error: true
        run: python tests_runtime_contract_011.py
      - name: Validate 0.11.1 game-log-derived Def rules
        id: runtime_def_audit
        continue-on-error: true
        run: python -m pip install lxml && python tests_runtime_0111.py
      - name: Resolve RimWorld 1.7 references
        run: dotnet restore ThornWhip/Source/ThornWhip.csproj
      - name: Compile the entire C# mod
        run: dotnet build ThornWhip/Source/ThornWhip.csproj -c Release --no-restore
      - name: Enforce complete static checks before creating an installable ZIP
        if: steps.audit.outcome == 'failure' || steps.static.outcome == 'failure' || steps.graphics.outcome == 'failure' || steps.runtime_def_audit.outcome == 'failure' || steps.test011.outcome == 'failure'
        run: |
          echo 'At least one structural validation failed. Compilation ran independently for full diagnostics.'
          exit 1
      - name: Confirm game DLL exists
        run: test -s ThornWhip/1.7/Assemblies/ThornWhip.dll
      - name: Package one installable mod directory
        run: |
          mkdir -p _release/ThornWhip
          cp -a ThornWhip/About ThornWhip/Defs ThornWhip/Textures ThornWhip/1.7 ThornWhip/LoadFolders.xml _release/ThornWhip/
          cd _release
          zip -qr ../ThornCorps_CE_0.11_TEST_INSTALL.zip ThornWhip
      - uses: actions/upload-artifact@v4
        with:
          name: ThornCorps-CE-0.11-TEST
          path: ThornCorps_CE_0.11_TEST_INSTALL.zip
          if-no-files-found: error
